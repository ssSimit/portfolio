<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | PlanetMergePlayable</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* =======================
           LOADING SCREEN
        ======================= */
        #loading-cover {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #loading-container {
            width: 160px;
        }

        /* PROGRESS BAR */
        #progress-bar-outer {
            width: 100%;
            height: 16px;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }

        #progress-bar-inner {
            width: 0%;
            height: 100%;
            background: #fff;
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loading-cover">
        <div id="loading-container">

            <!-- RECTANGULAR LOADING BAR -->
            <div id="progress-bar-outer">
                <div id="progress-bar-inner"></div>
            </div>
        </div>
    </div>

    <!-- UNITY CANVAS -->
    <canvas id="unity-canvas" width=540 height=960 tabindex="-1"
        style="width: 100%; height: 100vh;
        background: #231F20;">
    </canvas>

    <script src="Build/PlanetMergePlayableBuild.loader.js"></script>

    <script>
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.head.appendChild(meta);

            var canvas = document.querySelector("#unity-canvas");
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";

            document.body.style.textAlign = "left";
        }

        var loadingCover = document.getElementById("loading-cover");
        var progressBarInner = document.getElementById("progress-bar-inner");

        createUnityInstance(document.querySelector("#unity-canvas"), {
            arguments: [],
            dataUrl: "Build/PlanetMergePlayableBuild.data.unityweb",
            frameworkUrl: "Build/PlanetMergePlayableBuild.framework.js.unityweb",
            codeUrl: "Build/PlanetMergePlayableBuild.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "PlanetMergePlayable",
            productVersion: "1.0",
        }, function (progress) {
                var percent = Math.round(progress * 100);

                progressBarInner.style.width = percent + "%";

            }).then(function () {
                loadingCover.style.opacity = "0";
                loadingCover.style.pointerEvents = "none";
                setTimeout(() => loadingCover.style.display = "none", 500);
            });
    </script>

</body>

</html>
